<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ── Header ── -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z" fill="url(#shieldGrad)" />
          <path d="M9 12l2 2 4-4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="shieldGrad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#4f46e5"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="header-title">URL Shield</span>
    </div>
    <div class="backend-status" id="backend-status">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-label" id="status-label">Checking…</span>
    </div>
  </header>

  <!-- ── Tab Navigation ── -->
  <nav class="tab-nav">
    <button class="tab-btn active" id="tab-current" data-tab="current">Current Tab</button>
    <button class="tab-btn" id="tab-check" data-tab="check">Check URL</button>
    <button class="tab-btn" id="tab-history" data-tab="history">History</button>
  </nav>

  <!-- ══════════════ TAB: CURRENT PAGE ══════════════ -->
  <section class="tab-content active" id="panel-current">
    <!-- URL display -->
    <div class="url-bar" id="current-url-bar">
      <div class="url-bar-icon">🔗</div>
      <span class="url-bar-text" id="current-url-text">Loading…</span>
    </div>

    <!-- Verdict card -->
    <div class="verdict-card" id="verdict-card">
      <div class="verdict-loading" id="verdict-loading">
        <div class="spinner"></div>
        <span>Analyzing through 7-phase AI pipeline…</span>
      </div>

      <div class="verdict-result hidden" id="verdict-result">
        <!-- Verdict badge -->
        <div class="verdict-hero">
          <div class="verdict-circle" id="verdict-circle">
            <span class="verdict-icon" id="verdict-icon"></span>
          </div>
          <div class="verdict-info">
            <div class="verdict-label" id="verdict-label"></div>
            <div class="verdict-sublabel" id="verdict-sublabel"></div>
          </div>
        </div>

        <!-- Threat meter -->
        <div class="threat-meter">
          <div class="threat-meter-labels">
            <span>Threat Level</span>
            <span id="threat-pct">0%</span>
          </div>
          <div class="threat-bar">
            <div class="threat-fill" id="threat-fill"></div>
          </div>
        </div>

        <!-- Phase breakdown -->
        <div class="phases-grid" id="phases-grid">
          <!-- Populated by JS -->
        </div>

        <!-- Recommendation -->
        <div class="recommendation" id="recommendation-box">
          <div class="recommendation-label">Recommendation</div>
          <div class="recommendation-text" id="recommendation-text"></div>
        </div>
      </div>

      <div class="verdict-error hidden" id="verdict-error">
        <span class="error-icon">⚡</span>
        <div class="error-title">Backend Offline</div>
        <div class="error-msg">Start the Flask server to enable URL analysis.</div>
        <code class="error-cmd">cd backend && python app.py</code>
      </div>
    </div>

    <!-- Rescan button -->
    <button class="btn-rescan" id="btn-rescan">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
      Re-scan
    </button>
  </section>

  <!-- ══════════════ TAB: MANUAL CHECK ══════════════ -->
  <section class="tab-content hidden" id="panel-check">
    <div class="check-form">
      <label class="check-label" for="manual-url-input">Enter any URL to analyze</label>
      <div class="check-input-row">
        <input
          type="url"
          id="manual-url-input"
          class="check-input"
          placeholder="https://example.com"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="check-btn" id="check-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="manual-result-area">
      <!-- Manual result card inserted here by JS -->
    </div>
  </section>

  <!-- ══════════════ TAB: HISTORY ══════════════ -->
  <section class="tab-content hidden" id="panel-history">
    <div class="history-header">
      <span class="history-title">Recent Scans</span>
      <button class="history-clear-btn" id="history-clear-btn">Clear</button>
    </div>
    <div class="history-list" id="history-list">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer class="footer">
    <span>URL Shield v1.0 · 7-Phase AI Pipeline</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
